<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="wf-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="wf-accent-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="wf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Neural Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#wf-primary-grad)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.6" />
  
  <!-- Core Hex Shield -->
  <polygon points="50,14 81,32 81,68 50,86 19,68 19,32" 
    fill="#0f172a" 
    stroke="url(#wf-primary-grad)" 
    stroke-width="3" 
    filter="url(#wf-glow)" 
  />

  <!-- Dynamic 'X' & Workflow Flow Geometry -->
  <path d="M34 32 L66 68 M66 32 L34 68" 
    stroke="url(#wf-primary-grad)" 
    stroke-width="5.5" 
    stroke-linecap="round" 
  />

  <path d="M50 24 L50 76" 
    stroke="url(#wf-accent-grad)" 
    stroke-width="3" 
    stroke-linecap="round" 
    opacity="0.8"
  />

  <!-- Agent Node Orbitals -->
  <circle cx="50" cy="24" r="4.5" fill="#38bdf8" />
  <circle cx="66" cy="32" r="4.5" fill="#a855f7" />
  <circle cx="66" cy="68" r="4.5" fill="#38bdf8" />
  <circle cx="50" cy="76" r="4.5" fill="#06b6d4" />
  <circle cx="34" cy="68" r="4.5" fill="#a855f7" />
  <circle cx="34" cy="32" r="4.5" fill="#ec4899" />

  <!-- Center Autonomous Intelligence Core -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" />
  <circle cx="50" cy="50" r="4" fill="#6366f1" />
</svg>

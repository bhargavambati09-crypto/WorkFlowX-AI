services:
  - type: web
    name: WorkFlowX-AI
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://workflow-ai-org.netlify.app
      - key: AI_CONFIDENCE_THRESHOLD
        value: 0.75
